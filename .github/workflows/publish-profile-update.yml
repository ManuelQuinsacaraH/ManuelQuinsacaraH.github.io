name: Publish professional profile

on:
  push:
    branches: [profile-update]
    paths:
      - '.profile-upload/**'
      - '.github/workflows/publish-profile-update.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble updated profile PDF
        shell: bash
        run: |
          set -euo pipefail
          required=(
            .profile-upload/part01.txt .profile-upload/part02.txt .profile-upload/part03.txt .profile-upload/part04.txt
            .profile-upload/part05.txt .profile-upload/part06.txt .profile-upload/part07.txt .profile-upload/part08.txt
            .profile-upload/part09.txt .profile-upload/part10.txt .profile-upload/part11.txt .profile-upload/part12.txt
          )
          for f in "${required[@]}"; do
            if [[ ! -f "$f" ]]; then
              echo "Waiting for all PDF parts: missing $f"
              exit 0
            fi
          done
          cat .profile-upload/part*.txt | base64 -d > assets/Perfil_Profesional_Manuel_Quinsacara.pdf
          test "$(head -c 5 assets/Perfil_Profesional_Manuel_Quinsacara.pdf)" = "%PDF-"
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          test "$(pdfinfo assets/Perfil_Profesional_Manuel_Quinsacara.pdf | awk '/^Pages:/ {print $2}')" = "4"
          pdftotext assets/Perfil_Profesional_Manuel_Quinsacara.pdf - | grep -q "Cadena de Abastecimiento y Operaciones"
          rm -rf .profile-upload
          rm -f .github/workflows/publish-profile-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish updated professional profile" || exit 0
          git push
