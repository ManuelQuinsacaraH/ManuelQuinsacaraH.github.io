name: Audit current public PDFs
on:
  push:
    branches: [binary-update]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract text
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          mkdir -p .binary
          {
            echo '=== ATS ES ==='
            pdftotext -layout assets/Manuel_Quinsacara_CV_ATS_General_ES.pdf -
            echo '=== ATS EN ==='
            pdftotext -layout assets/Manuel_Quinsacara_Resume_ATS_General_EN.pdf -
            echo '=== PROFILE ==='
            pdftotext -layout assets/Perfil_Profesional_Manuel_Quinsacara.pdf -
          } > .binary/current-assets.txt
      - name: Commit audit text
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .binary/current-assets.txt
          git commit -m 'Audit current public PDFs' || true
          git push
