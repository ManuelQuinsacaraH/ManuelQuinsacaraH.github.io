name: Extract profile audit

on:
  push:
    branches: [profile-audit]

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract PDF text
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          pdftotext -layout assets/Perfil_Profesional_Manuel_Quinsacara.pdf .profile-audit.txt
      - name: Commit audit text
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .profile-audit.txt
          git commit -m "Extract professional profile text for audit" || true
          git push
